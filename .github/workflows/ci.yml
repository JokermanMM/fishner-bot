name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Render deploy hook is not configured yet
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Verification passed; skipping deploy until RENDER_DEPLOY_HOOK_URL is configured."

      - name: Trigger the verified commit on Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"
